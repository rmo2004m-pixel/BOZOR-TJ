<!doctype html><html lang="tg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#087744"><link rel="apple-touch-icon" href="/icon-192.png"><title>BoZor TJ</title><style>body{font:16px system-ui;margin:0;background:#f3f6f2;color:#18352b}header,nav{background:#087744;color:white;padding:18px}main{max-width:900px;margin:auto;padding:12px}button,input,select{font:inherit;padding:10px;border:1px solid #ccc;border-radius:9px;margin:4px;max-width:90%}button{background:#087744;color:white;border:0;cursor:pointer}nav button{background:#145d3e}#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}article,section{background:white;border-radius:12px;padding:10px;overflow-wrap:anywhere}article img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}article button{padding:7px}label{display:block}h1{margin:0}small{display:block}.x{background:#b3261e}</style><header><h1>BoZor TJ</h1>Меваю сабзавоти тару тоза • Душанбе</header><nav><button onclick="view('catalog')">Асосӣ</button><button onclick="view('cart')">Сабад</button><button onclick="view('tracking')">Фармоиш</button><button onclick="view('admin')">Идоракунӣ</button></nav><main><section id="catalog"><input id="search" placeholder="Ҷустуҷӯи маҳсулот" oninput="render()"><div id="grid"></div></section><section id="cart" hidden><h2>Сабад</h2><div id="basket"></div><label>Телефон <input id="phone" type="tel"></label><label>Суроға <input id="address"></label><label>Пардохт <select id="payment"><option value="cash">Нақдӣ ҳангоми расонидан</option><option value="alif">Алиф — бо расид</option><option value="dc">Душанбе Сити — бо расид</option></select></label><small>Барои Алиф ва Душанбе Сити: <b>555444551</b>. Маблағро интиқол диҳед ва расидро фиристед. Пардохтро маъмур месанҷад.</small><label>Расиди пардохт <input id="receipt" type="file" accept="image/*"></label><button onclick="order()">Фармоиш додан</button></section><section id="tracking" hidden><h2>Ҳолати фармоиш</h2><input id="token" placeholder="Рамзи пайгирӣ"><button onclick="track()">Санҷидан</button><p id="state"></p></section><section id="admin" hidden><h2>Идоракунии мағоза</h2><input id="key" type="password" placeholder="Рамзи маъмур"><button onclick="admin()">Фармоишҳо</button><h3>Маҳсулот</h3><input id="pid" type="number" placeholder="ID (барои таҳрир)"><input id="pn" placeholder="Ном"><input id="pp" type="number" placeholder="Нарх / кг"><input id="ps" type="number" placeholder="Захира / кг"><input id="pi" type="file" accept="image/*"><button onclick="save()">Сабт кардан</button><button class="x" onclick="del()">Нест кардан (ID)</button><div id="orders"></div></section><p id="msg" role="status"></p></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let products=[],cart={};const CANCEL='Бекор карда шуд',statuses=['Дар интизори тасдиқ','Пардохт тасдиқ шуд','Ҷамъоварӣ мешавад','Дар роҳ','Расонида шуд'];
async function api(url,data,key){let r=await fetch(url,data?{method:'POST',headers:{'Content-Type':'application/json','X-Key':key||''},body:JSON.stringify(data)}:{headers:{'X-Key':key||''}});let j=await r.json();if(!r.ok)throw Error(j.error||'Хатогӣ');return j}
function msg(s){$('msg').textContent=s}
function view(id){document.querySelectorAll('main section').forEach(e=>e.hidden=e.id!==id);if(id==='cart')basket()}
async function load(){products=await api('/products');render()}
function render(){$('grid').innerHTML=products.filter(p=>p.name.toLowerCase().includes($('search').value.toLowerCase())).map(p=>`<article>${/^data:image\/(png|jpeg|webp|gif);base64,/.test(p.photo)?`<img src="${esc(p.photo)}">`:''}<small>№ ${p.id}</small><b>${esc(p.name)}</b><small>${p.price} сомонӣ / кг</small><small>${p.stock} кг</small><button onclick="add(${p.id})" ${p.stock<=0?'disabled':''}>+ 1 кг</button></article>`).join('')||'Ҳоло маҳсулот нест'}
function add(id){let p=products.find(p=>p.id===id);cart[id]=Math.min(p.stock,(cart[id]||0)+1);msg('Ба сабад илова шуд')}
function basket(){let sum=0;$('basket').innerHTML=Object.entries(cart).map(([id,q])=>{let p=products.find(p=>p.id==id);if(!p)return '';sum+=q*p.price;return `<p>${esc(p.name)} <input type="number" min="0" step="0.5" value="${q}" onchange="qty(${id},this.value)"> кг</p>`}).join('')+`<p>Расонидан: 20 сомонӣ</p><b>Ҳамагӣ: ${sum+20} сомонӣ</b>`}
function qty(id,q){q=Number(q);if(q>0)cart[id]=q;else delete cart[id];basket()}
function file(id){return new Promise((res,rej)=>{let f=$(id).files[0];if(!f)return res('');if(f.size>4000000)return rej(Error('Акс хеле калон аст'));let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function order(){try{let r=await api('/order',{items:cart,phone:$('phone').value,address:$('address').value,payment:$('payment').value,receipt:await file('receipt')});cart={};$('token').value=r.token;localStorage.setItem('track',r.token);await load();view('tracking');track();msg('Фармоиш № '+r.id+' қабул шуд')}catch(e){msg(e.message)}}
async function track(){try{let r=await api('/track/'+encodeURIComponent($('token').value));$('state').textContent=r.status}catch(e){msg(e.message)}}
async function save(){try{let id=Number($('pid').value)||null;await api('/product',{id,name:$('pn').value,price:$('pp').value,stock:$('ps').value,photo:await file('pi')||products.find(p=>p.id===id)?.photo||''},$('key').value);await load();msg('Сабт шуд')}catch(e){msg(e.message)}}
async function del(){try{let id=Number($('pid').value);if(!id||!confirm('Маҳсулот № '+id+' нест шавад?'))return;await api('/delete',{id},$('key').value);await load();msg('Нест шуд')}catch(e){msg(e.message)}}
async function admin(){try{let rows=await api('/orders',null,$('key').value);$('orders').innerHTML=rows.map(r=>{let b=JSON.parse(r.body),fin=r.status===statuses[4]||r.status===CANCEL,i=statuses.indexOf(r.status),opts=fin?[]:statuses.filter((s,j)=>j===i+1||(i===0&&b.payment==='cash'&&j===2)).concat(CANCEL);return `<article><b>№ ${r.id}</b> • ${esc(r.status)}<p>${esc(b.phone)} • ${esc(b.address)} • ${b.total} сомонӣ • ${esc(b.payment)}</p><p>${b.items.map(t=>esc(t[0])+' '+t[1]+' кг').join(', ')}</p>${/^data:image\/(png|jpeg|webp|gif);base64,/.test(b.receipt)?`<img src="${esc(b.receipt)}">`:''}<select id="s${r.id}">${opts.map(s=>`<option>${s}</option>`).join('')}</select><button onclick="statusSet(${r.id})" ${fin?'disabled':''}>Сабт</button></article>`}).join('')}catch(e){msg(e.message)}}
async function statusSet(id){try{await api('/status',{id,status:$('s'+id).value},$('key').value);await admin();await load();msg('Сабт шуд')}catch(e){msg(e.message)}}
$('token').value=localStorage.getItem('track')||'';load().catch(e=>msg(e.message));if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});</script></html>
