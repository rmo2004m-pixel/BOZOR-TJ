name: Build BoZor TJ APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare application
        run: |
          mkdir -p mobile/www
          cd mobile
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          echo '<html><body>BoZor TJ</body></html>' > www/index.html
          echo '{"appId":"tj.bozor.shop","appName":"BoZor TJ","webDir":"www","server":{"url":"https://bozor-tj-q4s9.onrender.com","cleartext":false}}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BoZor-TJ-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
